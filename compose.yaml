services:
  web:
    image: ghcr.io/siedmiornica/surdev-site:latest
    container_name: surdev-site
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    security_opt:
      - no-new-privileges:true
    networks:
      - web

networks:
  web:
    external: true